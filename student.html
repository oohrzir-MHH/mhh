<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2b3a55">
<title>MH⋯H ｜ Where Minds Bond</title>
<style>
:root{
  --ink:#1a1d24; --ink-2:#5b6472; --line:#dfe3ea;
  --bg:#f4f6f9; --card:#fff; --brand:#2b3a55; --brand-2:#3d5a80;
  --ok:#2ea86a; --warn:#e8a13a; --bad:#e05260;
  --r:14px; --shadow:0 2px 10px rgba(20,25,40,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#eef1f6; --ink-2:#9aa4b4; --line:#333a48;
         --bg:#161a22; --card:#1e242e; --brand:#8fb3e0; --brand-2:#6d9bd1; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- 版面 ---------- */
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .logo{font-weight:800;letter-spacing:.5px;color:var(--brand);white-space:nowrap}
.top .who{margin-left:auto;font-size:.78rem;color:var(--ink-2);text-align:right;line-height:1.35}
.body{flex:1;padding:20px 16px calc(20px + var(--safe-b))}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:28px 22px;gap:14px}

h2{font-size:1.15rem;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:.9rem;margin:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 24px;border-radius:12px;font-weight:700;background:var(--card);
  border:1.5px solid var(--line);min-height:52px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.big{width:100%;font-size:1.05rem;min-height:60px}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}

/* ---------- 座號格 ---------- */
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px;margin-top:14px}
.seat{aspect-ratio:1/1;border-radius:12px;background:var(--card);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:var(--shadow);padding:2px}
.seat b{font-size:1.35rem;line-height:1.1}
.seat small{font-size:.66rem;color:var(--ink-2);max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.seat.taken{opacity:.34}
.seat.me{border-color:var(--brand);border-width:2.5px;background:color-mix(in srgb,var(--brand) 12%,var(--card))}

/* ---------- 題目 ---------- */
.q{font-size:1.16rem;font-weight:700;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.qimg{width:100%;border-radius:10px;margin-top:12px;display:block;cursor:zoom-in}
.qimghint{font-size:12px;color:var(--ink-2);text-align:center;margin:4px 0 0}

/* 圖片放大檢視：老師推出來的圖常常是課本掃描或數據表，
   在手機上縮成一欄根本看不清楚，所以一定要能全螢幕放大。
   用 touch-action:none 自己接手雙指縮放 —— 交給瀏覽器預設會連整頁一起縮。 */
.lbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;
  display:none;touch-action:none;overflow:hidden}
.lbox.on{display:block}
.lbox img{position:absolute;left:0;top:0;transform-origin:0 0;
  max-width:none;user-select:none;-webkit-user-drag:none}
.lbox-bar{position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;gap:8px;justify-content:center;padding:14px;
  background:linear-gradient(transparent,rgba(0,0,0,.75))}
.lbox-bar button{padding:11px 16px;border-radius:11px;border:0;
  background:#ffffff;color:#111;font-size:15px;font-weight:800}
.lbox-tip{position:absolute;left:0;right:0;top:0;z-index:2;padding:12px;
  text-align:center;color:#fff;font-size:13px;
  background:linear-gradient(rgba(0,0,0,.6),transparent)}
.qlink{display:inline-block;margin-top:12px;color:var(--brand);font-weight:700;
  word-break:break-all;text-decoration:underline}
.pill{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:99px;
  background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:700}

textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:inherit;
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px}
textarea{min-height:170px;resize:vertical;line-height:1.7}
input[type=number]{font-size:1.9rem;font-weight:800;text-align:center;padding:16px}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.choice{padding:15px 16px;border-radius:12px;background:var(--card);
  border:1.5px solid var(--line);text-align:left;font-weight:600}
.choice.sel{border-color:var(--brand);border-width:2.5px;
  background:color-mix(in srgb,var(--brand) 12%,var(--card))}

/* ---------- 畫布 ---------- */
.padwrap{background:#fff;border:1.5px solid var(--line);border-radius:12px;
  overflow:hidden;margin-top:12px;position:relative}
#pad{display:block;width:100%;touch-action:none;background:#fff}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;
  box-shadow:0 0 0 1.5px var(--line) inset}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
.tool{padding:9px 13px;border-radius:10px;background:var(--card);
  border:1.5px solid var(--line);font-size:.85rem;font-weight:700}
.tool.on{border-color:var(--brand);border-width:2.5px;color:var(--brand)}

.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + var(--safe-b));display:flex;gap:10px}
.foot .btn{flex:1}

/* ---------- 我的分數 ---------- */
.gcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 18px;margin-top:14px;border:1.5px solid var(--line)}
.gcard h3{margin:0 0 10px;font-size:1rem;color:var(--brand)}
.grow{display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-top:1px solid var(--line)}
.grow:first-of-type{border-top:0}
.grow span{color:var(--ink-2);font-size:.88rem}
.grow b{font-size:1.5rem;font-weight:800}
.gnote{font-size:.78rem;color:var(--ink-2);margin-top:10px;line-height:1.6}

.note{font-size:.82rem;color:var(--ink-2);margin-top:10px;line-height:1.6}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid var(--bad);
  color:var(--bad);border-radius:10px;padding:12px 14px;font-size:.86rem;margin-top:14px;
  text-align:left;white-space:pre-wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;
  animation:bp 1.5s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.big-ok{font-size:3.4rem;line-height:1}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 平板／電腦橫式 */
@media (min-width:760px){
  .body{max-width:820px;margin:0 auto;width:100%;padding:26px 24px}
  .foot{max-width:820px;margin:0 auto;width:100%;border-radius:14px 14px 0 0}
  .seatgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .q{font-size:1.3rem}
}
</style>
</head>
<body>

<!-- ══════════ 0 載入中 ══════════ -->
<div class="screen on" id="s-load">
  <div class="mid"><div class="spin"></div><p class="sub">連線中…</p></div>
</div>

<!-- ══════════ 1 登入 ══════════ -->
<div class="screen" id="s-login">
  <div class="mid">
    <div style="font-size:2.6rem;font-weight:800;color:var(--brand);letter-spacing:1px">MH⋯H</div>
    <h2 style="margin:0">Where Minds Bond</h2>
    <p class="sub" id="login-room">—</p>
    <button class="btn pri big" id="btn-login" style="max-width:330px;margin-top:12px">
      使用學校帳號登入</button>
    <p class="note" style="max-width:330px">
      請用 <b>@tngs.tn.edu.tw</b> 的學校帳號。<br>
      <b>只有第一次要登入</b>，之後這台裝置會直接進入。</p>
    <div class="err" id="login-err" style="display:none"></div>
  </div>
</div>

<!-- ══════════ 2 選座號 ══════════ -->
<div class="screen" id="s-seat">
  <div class="top"><span class="logo">MH⋯H</span>
    <span class="who" id="seat-who"></span></div>
  <div class="body">
    <h2>點一下你的座號</h2>
    <p class="sub">選錯了跟老師說，老師可以幫你解除。</p>
    <div class="seatgrid" id="seatgrid"></div>
    <div class="err" id="seat-err" style="display:none"></div>
  </div>
</div>

<!-- ══════════ 3 等待題目 ══════════ -->
<div class="screen" id="s-wait">
  <div class="top"><span class="logo">MH⋯H</span><span class="who" id="wait-who"></span></div>
  <div class="mid">
    <span class="dot"></span>
    <h2 style="margin:0">已就緒</h2>
    <p class="sub">老師推送題目後<br>這頁會自動出現，不用重整。</p>
    <button class="btn" id="btn-mygrade" style="margin-top:10px">📊 我的分數</button>
  </div>
</div>

<!-- ══════════ 3.5 我的分數 ══════════ -->
<div class="screen" id="s-grade">
  <div class="top"><span class="logo">MH⋯H</span><span class="who" id="grade-who"></span></div>
  <div class="body">
    <h2>我的分數</h2>
    <p class="sub" id="grade-sub">讀取中…</p>
    <div id="grade-box"></div>
    <div class="err" id="grade-err" style="display:none"></div>
  </div>
  <div class="foot">
    <button class="btn" id="btn-grade-refresh">重新整理</button>
    <button class="btn pri" id="btn-grade-back" style="flex:2">回上一頁</button>
  </div>
</div>

<!-- ══════════ 4 作答 ══════════ -->
<div class="screen" id="s-answer">
  <div class="top"><span class="logo">MH⋯H</span><span class="who" id="ans-who"></span></div>
  <div class="body">
    <span class="pill" id="q-kind">題目</span>
    <div class="q" id="q-text" style="margin-top:10px"></div>
    <img class="qimg" id="q-img" style="display:none" alt="題目附圖">
    <p class="qimghint" id="q-imghint" style="display:none">🔍 點圖片可以放大看</p>
    <a class="qlink" id="q-link" style="display:none" target="_blank" rel="noopener"></a>

    <div id="a-text" style="display:none;margin-top:16px">
      <textarea id="in-text" placeholder="在這裡寫下你的答案…"></textarea>
    </div>
    <div id="a-number" style="display:none;margin-top:16px">
      <input type="number" id="in-number" inputmode="decimal" placeholder="0">
    </div>
    <div id="a-choice" style="display:none"><div class="choices" id="choices"></div></div>
    <div id="a-draw" style="display:none">
      <div class="padwrap"><canvas id="pad"></canvas></div>
      <p class="qimghint" id="pad-bghint" style="display:none">
        老師的圖已經鋪在畫布上，直接在上面圈、標、寫</p>
      <div class="tools" id="tools"></div>
      <input type="file" id="pad-photo" accept="image/*" style="display:none">
    </div>

    <div class="err" id="ans-err" style="display:none"></div>
  </div>
  <div class="foot">
    <button class="btn" id="btn-clearans">清除</button>
    <button class="btn pri" id="btn-send" style="flex:2">送出</button>
  </div>
</div>

<!-- ══════════ 圖片放大檢視 ══════════ -->
<div class="lbox" id="lbox">
  <div class="lbox-tip">雙指縮放／雙擊放大　·　拖曳移動</div>
  <img id="lbox-img" alt="放大檢視">
  <div class="lbox-bar">
    <button id="lbox-out">－</button>
    <button id="lbox-fit">符合畫面</button>
    <button id="lbox-in">＋</button>
    <button id="lbox-close">關閉</button>
  </div>
</div>

<!-- ══════════ 5 已送出 ══════════ -->
<div class="screen" id="s-done">
  <div class="top"><span class="logo">MH⋯H</span><span class="who" id="done-who"></span></div>
  <div class="mid">
    <div class="big-ok">✅</div>
    <h2 style="margin:0">已送出</h2>
    <p class="sub" id="done-sub">老師已經收到你的答案。</p>
    <button class="btn" id="btn-redo" style="margin-top:8px">我要修改答案</button>
    <button class="btn" id="btn-mygrade2">📊 我的分數</button>
  </div>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, collection, getDoc, setDoc, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ═══════════ 設定 ═══════════ */
const CFG = {
  apiKey: "AIzaSyB21eHdFPd9W5o0Xa9EFvJEAk8Wsuzfzbw",
  authDomain: "mhh-tngs.firebaseapp.com",
  projectId: "mhh-tngs",
  storageBucket: "mhh-tngs.firebasestorage.app",
  messagingSenderId: "471690787859",
  appId: "1:471690787859:web:37fa09bcd09a54032013e6"
};
const DOMAIN = 'tngs.tn.edu.tw';

const app = initializeApp(CFG);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ═══════════ 小工具 ═══════════ */
const $ = s => document.querySelector(s);
const show = id => document.querySelectorAll('.screen')
  .forEach(el => el.classList.toggle('on', el.id === id));
const err = (sel, msg) => { const e = $(sel);
  e.style.display = msg ? 'block' : 'none'; e.textContent = msg || ''; };

const ROOM = new URLSearchParams(location.search).get('r');

function deviceId(){
  let d = localStorage.getItem('mhh_device');
  if(!d){ d = 'd_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
          localStorage.setItem('mhh_device', d); }
  return d;
}
const DEV = deviceId();

let ME = null;        // firebase user
let ROOMDATA = null;  // 房間文件
let MYSEAT = null;    // 我的座號
let CURQ = null;      // 目前題目
let SENTQ = null;     // 已送出的 qid

/* ═══════════ 啟動 ═══════════ */
if(!ROOM){
  show('s-login');
  err('#login-err', '網址少了教室代碼。\n請重新掃描老師提供的 QR Code，或向老師索取連結。');
  $('#btn-login').disabled = true;
} else {
  $('#login-room').textContent = `教室代碼　${ROOM}`;
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth, async u => {
    if(!u){ show('s-login'); return; }
    if(!(u.email || '').endsWith('@' + DOMAIN)){
      await signOut(auth);
      show('s-login');
      err('#login-err', `你登入的是 ${u.email}\n這不是學校帳號。\n請改用 @${DOMAIN} 的帳號再登入一次。`);
      return;
    }
    ME = u;
    const who = `${u.displayName || ''}<br>${u.email}`;
    ['#seat-who','#wait-who','#ans-who','#done-who']
      .forEach(s => $(s).innerHTML = who);
    await enterRoom();
  });
}

$('#btn-login').onclick = async () => {
  err('#login-err', '');
  const p = new GoogleAuthProvider();
  p.setCustomParameters({ hd: DOMAIN, prompt: 'select_account' });
  try { await signInWithPopup(auth, p); }
  catch(e){
    if(/popup-blocked|popup-closed|cancelled-popup/.test(e.code)){
      try { await signInWithRedirect(auth, p); return; } catch(_){}
    }
    err('#login-err', `登入失敗\n${e.code}\n\n如果訊息提到「管理員」或「已封鎖」，請告訴老師 —— 這是學校端的設定問題，不是你的錯。`);
  }
};

/* ═══════════ 進入教室 ═══════════ */
async function enterRoom(){
  let snap;
  try { snap = await getDoc(doc(db,'rooms',ROOM)); }
  catch(e){
    show('s-login');
    err('#login-err', `讀不到教室資料\n${e.code || e.message}`);
    return;
  }
  if(!snap.exists()){
    show('s-login');
    err('#login-err', `找不到教室「${ROOM}」。\n可能老師還沒開啟，或代碼看錯了。`);
    return;
  }
  ROOMDATA = snap.data();

  // 這台裝置之前綁過哪個座號？
  const cached = localStorage.getItem('mhh_seat_' + ROOM);
  if(cached){
    const s = await getDoc(doc(db,'rooms',ROOM,'seats',cached)).catch(()=>null);
    if(s && s.exists() && s.data().email === ME.email){ MYSEAT = cached; }
  }

  if(MYSEAT) listenQuestion();
  else       await renderSeats();
}

/* ═══════════ 選座號 ═══════════ */
async function renderSeats(){
  show('s-seat');
  const grid = $('#seatgrid');
  const roster = ROOMDATA.roster || [];
  if(!roster.length){
    err('#seat-err','老師還沒把班級名單推上來，請稍等一下再重新整理。');
    return;
  }
  const taken = {};
  onSnapshot(collection(db,'rooms',ROOM,'seats'), snap => {
    snap.forEach(d => taken[d.id] = d.data());
    grid.innerHTML = '';
    roster.forEach(st => {
      const no = String(st.no);
      const t  = taken[no];
      const mine = t && t.email === ME.email;
      const b = document.createElement('button');
      b.className = 'seat' + (t && !mine ? ' taken' : '') + (mine ? ' me' : '');
      b.innerHTML = `<b>${no}</b><small>${st.name || ''}</small>`;
      b.onclick = () => claim(no, st.name, t);
      grid.appendChild(b);
    });
  });
}

async function claim(no, name, taken){
  if(taken && taken.email !== ME.email){
    err('#seat-err', `${no} 號已經被 ${taken.displayName || '其他人'} 選走了。\n如果那是你的座號，請舉手跟老師說，老師可以解除。`);
    return;
  }
  err('#seat-err','');
  try{
    await setDoc(doc(db,'rooms',ROOM,'seats',String(no)), {
      no: Number(no), name: name || '', email: ME.email,
      displayName: ME.displayName || '', deviceId: DEV, claimedAt: serverTimestamp()
    });
    MYSEAT = String(no);
    localStorage.setItem('mhh_seat_' + ROOM, MYSEAT);
    listenQuestion();
  }catch(e){
    err('#seat-err', `綁定失敗\n${e.code || e.message}`);
  }
}

/* ═══════════ 監聽題目 ═══════════ */
function listenQuestion(){
  show('s-wait');
  onSnapshot(doc(db,'rooms',ROOM), snap => {
    if(!snap.exists()) return;
    ROOMDATA = snap.data();
    const q = ROOMDATA.question;
    if(!q || !q.qid){ CURQ = null; show('s-wait'); return; }
    if(CURQ && CURQ.qid === q.qid) return;      // 同一題，不重畫
    CURQ = q; SENTQ = null;
    renderQuestion(q);
  });
}

const KIND = { text:'文字作答', number:'數字作答', draw:'畫圖作答', choice:'選擇題' };

function renderQuestion(q){
  $('#q-kind').textContent = KIND[q.type] || '題目';
  $('#q-text').textContent = q.prompt || '';
  const img = $('#q-img'), ih = $('#q-imghint');
  /* 畫圖題的圖會直接鋪成畫布底圖，上面再放一張一模一樣的縮圖只是佔掉半個螢幕，
     而且學生會分不清該畫在哪一張上面。 */
  if(q.imageUrl && q.type !== 'draw'){
    img.src = q.imageUrl; img.style.display = 'block'; ih.style.display = '';
  }else{
    img.style.display = 'none'; ih.style.display = 'none';
    img.removeAttribute('src');
  }
  const lk = $('#q-link');
  if(q.linkUrl){ lk.href = q.linkUrl; lk.textContent = q.linkUrl; lk.style.display='inline-block'; }
  else lk.style.display = 'none';

  ['#a-text','#a-number','#a-choice','#a-draw']
    .forEach(s => $(s).style.display = 'none');
  err('#ans-err','');

  if(q.type === 'number'){ $('#a-number').style.display=''; $('#in-number').value=''; }
  else if(q.type === 'draw'){ $('#a-draw').style.display=''; initPad(q.imageUrl||null); }
  else if(q.type === 'choice'){
    $('#a-choice').style.display='';
    const box = $('#choices'); box.innerHTML=''; PICK = null;
    (q.choices||[]).forEach((c,i) => {
      const b = document.createElement('button');
      b.className='choice'; b.textContent = `${String.fromCharCode(65+i)}. ${c}`;
      b.onclick = () => { PICK = c;
        [...box.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
      box.appendChild(b);
    });
  }
  else { $('#a-text').style.display=''; $('#in-text').value=''; }

  show('s-answer');
}
let PICK = null;

/* ═══════════ 圖片放大檢視 ═══════════
   自己算 transform，不用瀏覽器的頁面縮放：
   頁面縮放會把作答欄跟按鈕一起放大，學生縮完就找不到「送出」在哪裡。 */
const LB = { z:1, x:0, y:0, iw:0, ih:0 };
function lboxOpen(src){
  const box=$('#lbox'), im=$('#lbox-img');
  im.onload=()=>{ LB.iw=im.naturalWidth; LB.ih=im.naturalHeight; lboxFit(); };
  im.src=src; box.classList.add('on');
  if(im.complete && im.naturalWidth){ LB.iw=im.naturalWidth; LB.ih=im.naturalHeight; lboxFit(); }
}
function lboxApply(){
  const im=$('#lbox-img');
  im.style.transform=`translate(${LB.x}px,${LB.y}px) scale(${LB.z})`;
}
function lboxFit(){
  if(!LB.iw) return;
  /* 扣掉底下工具列的高度，但視窗本身比工具列還矮時（橫放的小螢幕、
     嵌在別的框裡）會扣成負的 —— 負的縮放會把圖上下顛倒過來。 */
  const h=Math.max(120, innerHeight-70);
  const z=Math.max(.02, Math.min(innerWidth/LB.iw, h/LB.ih));
  LB.z=z; LB.x=(innerWidth-LB.iw*z)/2; LB.y=(h-LB.ih*z)/2;
  lboxApply();
}
/* 以某個畫面座標為中心縮放 —— 不然放大後想看的地方會跑出畫面外 */
function lboxZoomAt(f, cx, cy){
  const nz=Math.max(.1, Math.min(12, LB.z*f));
  const k=nz/LB.z;
  LB.x = cx - (cx-LB.x)*k;
  LB.y = cy - (cy-LB.y)*k;
  LB.z = nz; lboxApply();
}
(function(){
  const box=$('#lbox');
  $('#lbox-close').onclick=()=>box.classList.remove('on');
  $('#lbox-fit').onclick=lboxFit;
  $('#lbox-in').onclick =()=>lboxZoomAt(1.4, innerWidth/2, innerHeight/2);
  $('#lbox-out').onclick=()=>lboxZoomAt(1/1.4, innerWidth/2, innerHeight/2);

  const pts=new Map(); let base=0, lastMid=null, lastTap=0;
  const mid=()=>{ const a=[...pts.values()];
    return [(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2]; };
  const dist=()=>{ const a=[...pts.values()];
    return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };

  box.addEventListener('pointerdown', e=>{
    if(e.target.closest('.lbox-bar')) return;
    box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ base=dist(); lastMid=mid(); }
    else{
      const now=Date.now();
      if(now-lastTap<300) lboxZoomAt(LB.z>1.5?1/2:2, e.clientX, e.clientY);
      lastTap=now;
    }
  });
  box.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      const d=dist(), m=mid();
      if(base){ lboxZoomAt(d/base, m[0], m[1]); base=d; }
      if(lastMid){ LB.x+=m[0]-lastMid[0]; LB.y+=m[1]-lastMid[1]; lboxApply(); }
      lastMid=m;
    }else{
      LB.x+=e.clientX-prev.x; LB.y+=e.clientY-prev.y; lboxApply();
    }
  });
  const drop=e=>{ pts.delete(e.pointerId); if(pts.size<2){ base=0; lastMid=null; } };
  box.addEventListener('pointerup', drop);
  box.addEventListener('pointercancel', drop);
  box.addEventListener('wheel', e=>{ e.preventDefault();
    lboxZoomAt(e.deltaY<0?1.15:1/1.15, e.clientX, e.clientY); }, {passive:false});
  addEventListener('keydown', e=>{ if(e.key==='Escape') box.classList.remove('on'); });

  $('#q-img').onclick=function(){ if(this.src) lboxOpen(this.src); };
})();

/* ═══════════ 畫布 ═══════════ */
let PAD_W = 1600, PAD_H = 1200;
const COLORS = ['#111111','#e05260','#2f7bd6','#2ea86a','#e8a13a','#8e5bd0'];
let pad, pctx, strokes = [], cur = null, penColor = COLORS[0], penW = 6, erasing = false, padReady = false;

/* 底圖：老師推的題目圖，或學生自己拍／選的照片。
   畫布跟著底圖的長寬比走，不要硬塞進 4:3 —— 直式的課本照片被壓成橫的就沒法標了。
   底圖存原圖（bgSrc）而不是「已經畫進畫布的樣子」：
   橡皮擦要能擦掉筆跡而不是把底圖一起擦成白色，就必須每次重畫時重疊一次底圖。 */
let BG = null, bgSrc = null;

function padResize(w, h){
  const max = 1600, sc = Math.min(1, max/Math.max(w,h));
  PAD_W = Math.max(2, Math.round(w*sc));
  PAD_H = Math.max(2, Math.round(h*sc));
  pad.width = PAD_W; pad.height = PAD_H;
  pad.style.aspectRatio = `${PAD_W}/${PAD_H}`;
}

function setPadBg(src, keepStrokes){
  if(!src){ BG=null; bgSrc=null; padResize(1600,1200); if(!keepStrokes) strokes=[]; redraw(); return; }
  const im = new Image();
  im.onload = () => {
    BG = im; bgSrc = src;
    padResize(im.naturalWidth, im.naturalHeight);
    if(!keepStrokes) strokes = [];
    redraw();
    const hint=$('#pad-bghint'); if(hint) hint.style.display='';
  };
  im.onerror = () => { BG=null; bgSrc=null; redraw(); };
  im.src = src;
}

function initPad(bgUrl){
  pad = $('#pad');
  pctx = pad.getContext('2d');
  strokes = []; BG = null; bgSrc = null;
  padResize(1600, 1200);
  redraw();
  if(bgUrl) setPadBg(bgUrl);
  const hint=$('#pad-bghint'); if(hint) hint.style.display = bgUrl ? '' : 'none';
  if(padReady) return;
  padReady = true;

  const tools = $('#tools');
  COLORS.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i===0?' on':''); b.style.background = c;
    b.onclick = () => { penColor = c; erasing = false;
      tools.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); syncTools(); };
    tools.appendChild(b);
  });
  [['細',3],['中',6],['粗',14]].forEach(([t,w],i) => {
    const b = document.createElement('button');
    b.className = 'tool' + (i===1?' on':''); b.textContent = t; b.dataset.w = w;
    b.onclick = () => { penW = w; erasing = false;
      tools.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); syncTools(); };
    tools.appendChild(b);
  });
  const eb = document.createElement('button');
  eb.className='tool'; eb.id='btn-eraser'; eb.textContent='橡皮擦';
  eb.onclick = () => { erasing = !erasing; syncTools(); };
  tools.appendChild(eb);
  const ub = document.createElement('button');
  ub.className='tool'; ub.textContent='↩︎ 復原';
  ub.onclick = () => { strokes.pop(); redraw(); };
  tools.appendChild(ub);

  /* 📷 學生自己放一張照片當底圖：拍實驗結果、拍手寫的計算過程、拍課本某一段，
     再直接在上面圈重點。這就是「用圖片回饋」——
     它跟老師推的底圖走同一條路（畫進同一張畫布、送出時一起帶走），
     所以後端一行都不用改。 */
  const pb = document.createElement('button');
  pb.className='tool'; pb.textContent='📷 放照片';
  pb.onclick = () => $('#pad-photo').click();
  tools.appendChild(pb);

  const zb = document.createElement('button');
  zb.className='tool'; zb.textContent='🔍 放大看';
  zb.onclick = () => lboxOpen(pad.toDataURL('image/png'));
  tools.appendChild(zb);

  $('#pad-photo').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';                      // 同一張照片要能再選一次
    if(!f || !/^image\//.test(f.type)) return;
    const raw = await new Promise(r => { const fr=new FileReader();
      fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
    /* 保留已經畫的筆跡：學生常常是先畫了才想到要補一張照片 */
    setPadBg(raw, true);
    err('#ans-err','');
  });

  const pos = ev => {
    const r = pad.getBoundingClientRect();
    return [ (ev.clientX - r.left) * PAD_W / r.width,
             (ev.clientY - r.top ) * PAD_H / r.height ];
  };
  pad.addEventListener('pointerdown', ev => {
    ev.preventDefault(); pad.setPointerCapture(ev.pointerId);
    cur = { color:penColor, w: erasing ? penW*4 : penW, erase:erasing, pts:[pos(ev)] };
    strokes.push(cur); redraw();
  });
  pad.addEventListener('pointermove', ev => {
    if(!cur) return; ev.preventDefault(); cur.pts.push(pos(ev)); redraw();
  });
  const end = () => { cur = null; };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
  pad.addEventListener('pointerleave', end);
}
function syncTools(){
  const eb = $('#btn-eraser'); if(eb) eb.classList.toggle('on', erasing);
}
/* 筆跡畫在另一張透明畫布上再疊回去。
   ★ 為什麼不直接在主畫布上用白色當橡皮擦：有底圖的時候，
     白線會把底圖一起塗掉，學生一擦就多一道白疤，那不叫擦掉。
     畫在透明層上用 destination-out 挖掉，底圖才會原樣露出來。 */
let INK = null;
function redraw(){
  pctx.fillStyle = '#fff'; pctx.fillRect(0,0,PAD_W,PAD_H);
  if(BG) pctx.drawImage(BG, 0, 0, PAD_W, PAD_H);

  if(!INK) INK = document.createElement('canvas');
  if(INK.width !== PAD_W || INK.height !== PAD_H){ INK.width = PAD_W; INK.height = PAD_H; }
  const ic = INK.getContext('2d');
  ic.clearRect(0,0,PAD_W,PAD_H);
  ic.lineCap = 'round'; ic.lineJoin = 'round';
  strokes.forEach(s => {
    ic.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ic.strokeStyle = s.color;
    ic.lineWidth = s.w;
    ic.beginPath();
    s.pts.forEach(([x,y],i) => i ? ic.lineTo(x,y) : ic.moveTo(x,y));
    if(s.pts.length === 1) ic.lineTo(s.pts[0][0]+.1, s.pts[0][1]+.1);
    ic.stroke();
  });
  ic.globalCompositeOperation = 'source-over';
  pctx.drawImage(INK, 0, 0);
}

/* ═══════════ 我的分數（2026-08-30） ═══════════
   老師按了「發布本班成績」才會有東西。
   規則只讓學生讀 rooms/{code}/grades/{自己的座號}，所以看不到別人的分數，
   也沒有全班排名 —— 排名投影在教室前面是一回事，寫進每個人的手機是另一回事。 */

let BACKTO = 's-wait';

async function loadGrade(){
  const box = $('#grade-box'), sub = $('#grade-sub');
  err('#grade-err',''); box.innerHTML = ''; sub.textContent = '讀取中…';
  if(!ME || !MYSEAT){ sub.textContent = ''; return err('#grade-err','請先登入並選好自己的座號。'); }
  let snap;
  try{
    snap = await getDoc(doc(db,'rooms',ROOM,'grades',String(MYSEAT)));
  }catch(e){
    sub.textContent = '';
    return err('#grade-err', e.code === 'permission-denied'
      ? '讀不到你的成績。可能是這個座號綁的不是你的帳號，請跟老師說。'
      : ('讀取失敗：' + (e.code || e.message)));
  }
  if(!snap.exists()){
    sub.textContent = '';
    box.innerHTML = '<div class="gcard"><h3>老師還沒有公布</h3>'
      + '<p class="gnote">分數要老師按「發布」之後才查得到。公布之後回來這裡重新整理就會出現。</p></div>';
    return;
  }
  const g = snap.data();
  const me = g.me || {}, gp = g.group || {};
  sub.textContent = `${g.className || ''}　${g.no} 號 ${g.name || ''}`;
  const t = (label, val, unit) =>
    `<div class="grow"><span>${label}</span><b>${val}${unit || ''}</b></div>`;
  const esc = x => String(x == null ? '' : x).replace(/</g,'&lt;');

  /* ★ 2026-08-30：出缺席、作業分數、老師評語。
     這三塊只有**試算表**裡有（老師在 `班·<班級>` 分頁上打的），
     老師按「發布」時才會併進來。
     ★ 沒有就整塊不顯示，不要顯示一排 0 ——
       「老師還沒登記」和「你是零分」是完全不同的兩件事，
       而看到 0 的學生會直接來問。 */
  const at = g.attend || null, wk = g.work || null;
  const attendCard = at ? `
     <div class="gcard"><h3>出缺席</h3>
       ${t('出席', at.present ?? 0, ' 堂')}
       ${at.late      ? t('遲到',   at.late,     ' 堂') : ''}
       ${at.absent    ? t('曠課',   at.absent,   ' 堂') : ''}
       ${at.personal  ? t('事假',   at.personal, ' 堂') : ''}
       ${at.sick      ? t('病假',   at.sick,     ' 堂') : ''}
       ${at.official  ? t('公假',   at.official, ' 堂') : ''}
       ${at.left      ? t('中途離開', at.left,   ' 次') : ''}
       ${at.unmarked  ? t('還沒登記', at.unmarked,' 堂') : ''}
       <p class="gnote">登記有誤請直接跟老師說，這一頁只能看、不能改。</p>
     </div>` : '';

  const workCard = (wk && (wk.score || wk.comment)) || g.teacherNote ? `
     <div class="gcard"><h3>作業與評語</h3>
       ${wk && wk.score ? t('作業分數', esc(wk.score), '') : ''}
       ${wk && wk.comment ? `<p class="gnote"><b>作業評語</b><br>${esc(wk.comment)}</p>` : ''}
       ${g.teacherNote ? `<p class="gnote"><b>老師的話</b><br>${esc(g.teacherNote)}</p>` : ''}
     </div>` : '';

  box.innerHTML =
    `<div class="gcard"><h3>我自己</h3>
       ${t('累積總分', me.total ?? 0, ' 分')}
       ${t('每堂平均', me.avg ?? 0, ' 分')}
       ${t('發言次數', me.say ?? 0, ' 次')}
     </div>
     ${attendCard}
     ${workCard}
     <div class="gcard"><h3>第 ${gp.table || '—'} 組</h3>
       ${t('全組總分', gp.total ?? 0, ' 分')}
       ${t('每堂平均', gp.avg ?? 0, ' 分')}
       ${t('平均每人', gp.perMember ?? 0, ' 分')}
       <p class="gnote">只要組上被指派任務的人把事情做完，<b>全組每個人都會拿到那一筆分數</b>。
         所以組的分數不只是你一個人的事。</p>
     </div>
     <p class="gnote">統計到 <b>${g.sessions || 1}</b> 堂課，
       老師最後一次公布：${g.publishedAt ? new Date(g.publishedAt).toLocaleString('zh-TW') : '—'}。
       ${g.sheetAt ? `<br>成績表更新於 ${esc(g.sheetAt)}。` : ''}
       公布之後老師再加的分，要等老師下次公布才會更新。</p>`;
}

$('#btn-mygrade').onclick = () => {
  /* 記住是從哪一頁按進來的：作答到一半跑去看分數，回來要回到那一題。 */
  BACKTO = document.querySelector('.screen.on')?.id || 's-wait';
  show('s-grade');
  $('#grade-who').textContent = $('#wait-who').textContent;
  loadGrade();
};
$('#btn-mygrade2').onclick = $('#btn-mygrade').onclick;
$('#btn-grade-refresh').onclick = loadGrade;
$('#btn-grade-back').onclick = () => show(BACKTO);

/* ═══════════ 送出 ═══════════ */
$('#btn-clearans').onclick = () => {
  if(!CURQ) return;
  if(CURQ.type === 'draw'){
    strokes = [];
    /* 「清除」只清筆跡。老師推的底圖不該被學生清掉 ——
       清掉就沒得畫了，而且他找不到方法把它弄回來。
       學生自己放的照片才可以清掉（再按一次「放照片」換一張）。 */
    if(bgSrc && bgSrc !== (CURQ.imageUrl||null)) setPadBg(CURQ.imageUrl||null, true);
    redraw();
  }
  else if(CURQ.type === 'number') $('#in-number').value = '';
  else if(CURQ.type === 'choice'){ PICK = null;
    $('#choices').querySelectorAll('.choice').forEach(x=>x.classList.remove('sel')); }
  else $('#in-text').value = '';
};

$('#btn-send').onclick = async () => {
  if(!CURQ || !ME || !MYSEAT) return;
  const payload = { qid: CURQ.qid, no: Number(MYSEAT),
    name: (ROOMDATA.roster||[]).find(s=>String(s.no)===MYSEAT)?.name || '',
    email: ME.email, displayName: ME.displayName || '',
    type: CURQ.type, submittedAt: serverTimestamp() };

  if(CURQ.type === 'draw'){
    if(!strokes.length && !BG)
      return err('#ans-err','畫布還是空的，畫點東西或放一張照片再送出。');
    /* 有底圖（照片、課本掃描）時 PNG 會大到幾 MB，直接走 JPEG。
       Firestore 單一文件 1MB 是硬上限，超過去是整筆送不出，不是變模糊。 */
    let data = BG ? pad.toDataURL('image/jpeg', .88) : pad.toDataURL('image/png');
    if(data.length > 900000) data = pad.toDataURL('image/jpeg', .75);
    if(data.length > 950000) data = pad.toDataURL('image/jpeg', .55);
    if(data.length > 950000)
      return err('#ans-err','圖太大了，請換一張解析度低一點的照片，或按「清除」重畫簡單一點。');
    payload.drawing = data;
  } else if(CURQ.type === 'number'){
    const v = $('#in-number').value.trim();
    if(v === '') return err('#ans-err','還沒填數字。');
    payload.number = Number(v); payload.text = v;
  } else if(CURQ.type === 'choice'){
    if(!PICK) return err('#ans-err','還沒選一個答案。');
    payload.text = PICK;
  } else {
    const v = $('#in-text').value.trim();
    if(!v) return err('#ans-err','還沒寫答案。');
    payload.text = v;
  }

  const btn = $('#btn-send');
  btn.disabled = true; btn.textContent = '送出中…';
  try{
    await setDoc(doc(db,'rooms',ROOM,'answers',`${CURQ.qid}__${MYSEAT}`), payload);
    SENTQ = CURQ.qid;
    $('#done-sub').textContent =
      `${MYSEAT} 號 ${payload.name}　—　老師已經收到你的答案。`;
    show('s-done');
  }catch(e){
    err('#ans-err', `送出失敗\n${e.code || e.message}\n\n請檢查網路，再按一次送出。`);
  }finally{
    btn.disabled = false; btn.textContent = '送出';
  }
};

$('#btn-redo').onclick = () => { if(CURQ) show('s-answer'); };
</script>
